# One hint per rule: nah guards (by guard name) and hintguard's own rules.
# The agent reads: "Denied (<rule>): <rewrite> Why: <why>"
# Rules (tests/test_hints.py fails otherwise): rewrite starts with an imperative verb; no hint mentions
# a human (user, operator, manual approval, permission); whole line at most 200 characters.
# When no safe variant exists, the rewrite says to drop the step and go on.
# example: a command following the hint; tests check hintguard does not deny it (no hint loops).
# Every hint has one, except "drop this step" hints.

[rm-unresolvable]
rewrite = "Delete only literal paths: write throwaway files to a temporary directory and skip the cleanup, or rm a literal path."
why = "the rm target is only known at run time."
example = "rm -rf ./build-cache"

[db-destroy]
rewrite = "Work on a copy: dump the data first, or use a filtered DELETE, a new table, or a local database."
why = "it destroys live database data."
example = "pg_dump app > app.sql"

[exec-decoded]
rewrite = "Write the decoded code to a file, read it, then run that file."
why = "it runs code decoded on the fly."
example = "base64 -d payload.b64 > payload.sh"

[exec-network-shell]
rewrite = "Drop the shell attachment; run the explicit command you need instead."
why = "it attaches a shell to a network connection."
example = "nc -z example.org 443"

[exec-obfuscated]
rewrite = "Spell the command name and arguments out literally instead of computing them."
why = "the program that runs is hidden or computed."
example = "/usr/bin/python3 -c 'print(1)'"

[exec-remote]
rewrite = "Download the script to a file, read it, then run the file."
why = "it runs code straight from the network."
example = "curl -fsSL -o install.sh https://example.org/install.sh"

[fs-auth-identity]
rewrite = "Leave authentication and identity files untouched; drop this step and continue."
why = "it changes login, key or privilege files."

[fs-forkbomb]
rewrite = "Bound the loop: wait for each background job, or cap the number of jobs."
why = "it spawns processes without bound."
example = "for f in a b c; do gzip -k \"$f\" & done; wait"

[fs-home]
rewrite = "Target a specific subdirectory with a literal path, never the home folder itself."
why = "it deletes or rewrites the whole home folder."
example = "rm -rf ~/workspace/old-build"

[fs-outside-workspace-delete]
rewrite = "Delete only inside the project or a temporary directory, with a literal path."
why = "it deletes recursively outside the project."
example = "rm -rf ./build"

[fs-permission-weaken]
rewrite = "Use the narrowest mode that works, such as 755 or 644, without world-write or setuid."
why = "it grants world-write or setuid."
example = "chmod 755 run.sh"

[fs-project-root]
rewrite = "Name the specific files or subdirectories to delete instead of the project root."
why = "it wipes the whole project."
example = "rm -rf ./build ./dist"

[fs-raw-device]
rewrite = "Write to a regular file instead of a device."
why = "it writes to a raw storage device."
example = "dd if=/dev/zero of=./disk.img bs=1M count=10"

[fs-shell-profile]
rewrite = "Set the variable in the command itself, or in a project script, instead of the shell profile."
why = "it changes the shell profile."
example = "FOO=1 ./run.sh"

[fs-startup-management]
rewrite = "Write the job as a script in the project and leave system schedules and services unchanged."
why = "it changes what starts at boot or on a schedule."
example = "printf '#!/bin/sh\\n./build.sh\\n' > job.sh"

[fs-startup-persistence]
rewrite = "Write the job as a script in the project; leave startup, autostart and schedule files untouched."
why = "it changes startup, autostart or schedule files."
example = "printf '#!/bin/sh\\n./build.sh\\n' > job.sh"

[fs-system-tree]
rewrite = "Name a specific path inside the project or a temporary directory instead of a system tree."
why = "it targets / or a system tree."
example = "rm -rf ./tmp-output"

[fs-volume-destroy]
rewrite = "Leave volumes and pools in place; drop this step and continue."
why = "it destroys a storage volume."

[git-clean-force]
rewrite = "Delete the specific untracked files by literal path, or run git clean -n first to list them."
why = "it deletes every untracked file."
example = "git clean -n"

[git-force-push]
rewrite = "Push to a new branch, or use --force-with-lease on a feature branch."
why = "it overwrites remote history."
example = "git push origin HEAD:refs/heads/fix-1"

[git-hard-reset]
rewrite = "Run git stash first, or use git reset --keep, or restore single files."
why = "it discards uncommitted changes."
example = "git stash && git reset --keep HEAD~1"

[git-history-rewrite]
rewrite = "Merge instead of rebasing, or make the rewrite on a new branch."
why = "it rewrites existing history."
example = "git merge origin/main"

[git-metadata]
rewrite = "Use git commands instead of editing or deleting .git directly."
why = "it damages the repository history."
example = "git gc"

[git-path-discard]
rewrite = "Save local changes first with git stash or git diff > patch, then restore the file."
why = "it discards uncommitted changes to the file."
example = "git diff src/a.py > a.patch"

[git-protected-push]
rewrite = "Push to a feature branch instead of main or master."
why = "it pushes straight to main."
example = "git push origin HEAD:refs/heads/feature-x"

[git-recovery-destroy]
rewrite = "Keep the reflog and stash; drop single stash entries by name if needed."
why = "it destroys git's recovery history."
example = "git stash list"

[git-ref-delete]
rewrite = "Keep the ref; rename or tag it instead of deleting it."
why = "it deletes a branch, stash or worktree."
example = "git branch -m old archive/old"

[git-remote-repo-delete]
rewrite = "Archive the repository instead, or drop this step and continue."
why = "it deletes a whole hosted repository."
example = "gh repo archive owner/project --yes"

[git-remote-resource-delete]
rewrite = "Keep the hosted resource; drop this step and continue."
why = "it deletes a release, secret or other hosted resource."

[git-rewrite-force]
rewrite = "Rewrite history in a fresh clone, without --force, and compare."
why = "it rewrites history and bypasses backups."
example = "git clone --mirror . ../rewrite.git"

[git-worktree-discard]
rewrite = "Run git stash first, then switch branches or remove the worktree without -f."
why = "it discards uncommitted work."
example = "git stash && git switch other"

[infra-container-reset]
rewrite = "Remove the specific containers or images by name instead of resetting everything."
why = "it resets all container state."
example = "podman rm old-container"

[infra-container-volume-delete]
rewrite = "Stop the containers without removing their volumes, or remove one named volume."
why = "it deletes container volumes and their data."
example = "docker compose down"

[infra-iac-destroy]
rewrite = "Run a plan or a dry run instead of destroying the stack."
why = "it destroys provisioned infrastructure."
example = "terraform plan -destroy"

[infra-k8s-delete]
rewrite = "Delete named resources one by one, or use --dry-run=client first."
why = "it deletes Kubernetes resources in bulk."
example = "kubectl delete pod web-1 --dry-run=client"

[net-lookalike-host]
rewrite = "Retype the hostname in plain ASCII."
why = "the hostname imitates another one."
example = "curl -fsSL https://github.com"

[registry-publish]
rewrite = "Run the publish as a dry run, or publish from CI via a tagged release."
why = "it publishes a package to a public registry."
example = "npm publish --dry-run"

[registry-unpublish]
rewrite = "Deprecate the release or publish a fixed version instead."
why = "it unpublishes a released package."
example = "npm deprecate pkg@1.0.0 'use 1.0.1'"

[secrets-credentials]
rewrite = "Let the program that needs the key use it directly instead of reading key files."
why = "it reads or moves private keys or credentials."
example = "ssh -T git@github.com"

[secrets-env]
rewrite = "Let the program read .env itself; never print or source .env in the shell."
why = "it prints secret values."
example = "python3 app.py"

[secrets-exfil]
rewrite = "Send only the non-secret fields you need, never .env or the environment."
why = "it sends secrets over the network."
example = "curl -fsS -d 'status=ok' https://example.org/ping"

[secrets-store-delete]
rewrite = "Keep the secret; drop this step and continue."
why = "it deletes a secret from a secret store."

[secrets-store-destroy]
rewrite = "Keep the secret; drop this step and continue."
why = "it permanently destroys a stored secret."

[secrets-store-read]
rewrite = "Check that the secret exists without printing its value, for example by listing names."
why = "it prints a secret value."
example = "vault kv list secret/"

[storage-backup-destroy]
rewrite = "Keep the backups; delete single old snapshots by name if needed."
why = "it deletes a whole backup repository."
example = "restic snapshots"

[storage-recursive-delete]
rewrite = "Sync without deleting at the destination, or delete single objects by name."
why = "it deletes remote data in bulk."
example = "rsync -a ./out/ host:/srv/out/"

[storage-snapshot-delete]
rewrite = "Keep the snapshot; drop this step and continue."
why = "it deletes a snapshot or backup."

[sys-power]
rewrite = "Do not reboot or shut down; finish the work without it and drop this step."
why = "it reboots or powers off the host."

[sys-service-stop]
rewrite = "Restart the one service you changed, or stop only your own process by PID."
why = "it stops a system service or all containers."
example = "kill 12345"

[nah]
rewrite = "Drop this step: leave nah and the agent's hook configuration untouched."
why = "it changes the guard itself."
